<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style_register.css">
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap" rel="stylesheet">
    <title>Login System - Criar Conta</title>
    <script src="./js/theme.js" defer></script>
</head>
<body>
    <!-- Lado Esquerdo -->
    <button class="theme-toggle-btn">☀</button>
    <p class="theme-toggle-p">*</p>
    <main class="register-wrapper">
        <header class="register_info">
            <h1>Criar Conta</h1>
            <p>Preencha seus dados para se cadastrar no sistema</p>
            <span>Já Possui Conta?</span>
            <a href="./index.html">Voltar para o Login</a>
        </header>
        <!-- Lado Direito -->
        <section class="register_card">
            <form id="registerForm">
                <div class="input-group">
                    <label>Nome Completo:</label> <!-- Rótulo para o campo de usuário -->
                    <input type="text" placeholder="Digite seu Nome" required> <!-- Campo de entrada para o nome de usuário -->
                </div>
                <div class="input-group">
                    <label>Email:</label> <!-- Rótulo para o campo de confirmação de usuário -->
                    <input type="email" placeholder="Digite seu Email" required> <!-- Campo de entrada para o email de usuário -->
                </div>
                <div class="input-group">
                    <label>Senha:</label> <!-- Rótulo para o campo de senha -->
                    <input type="password" placeholder="Digite sua Senha" required> <!-- Campo de entrada para a senha -->
                </div>
                <div class="input-group">
                    <label>Confirmar Senha:</label> <!-- Rótulo para o campo de confirmação de senha -->
                    <input type="password" placeholder="Confirme sua Senha" required> <!-- Campo de entrada para a confirmação de senha -->
                </div>
                <button type="submit">Cadastrar</button> <!-- Botão de envio do formulário -->
            </form>
        </section>
    </main>
</body>
</html>
